name: Release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Calculate version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(npx --yes @circlesac/oneup version --target package.json | tail -1)
          while gh release view "v${VERSION}" >/dev/null 2>&1; do
            VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: versioned-files
          path: package.json

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-x64
            name: slack2-darwin-x64
          - os: macos-latest
            target: bun-darwin-arm64
            name: slack2-darwin-arm64
          - os: ubuntu-latest
            target: bun-linux-x64
            name: slack2-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            name: slack2-linux-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Download versioned files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name versioned-files --dir versioned-files
          cp versioned-files/package.json package.json

      - name: Build binary
        run: |
          bun build --compile --target=${{ matrix.target }} --outfile=slack2 src/index.ts
          if [[ "${{ matrix.target }}" == bun-darwin-* ]]; then
            codesign --remove-signature slack2
            codesign --force --deep -s - slack2
          fi
          tar czf ${{ matrix.name }}.tar.gz slack2

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            bin/install.sh

  publish-npm:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download versioned files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name versioned-files --dir versioned-files
          cp versioned-files/package.json package.json

      - name: Publish to npm
        run: npm publish --access public

  publish-homebrew:
    needs: [version, release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --dir artifacts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=${{ needs.version.outputs.version }}

          SHA_DARWIN_ARM64=$(shasum -a 256 artifacts/slack2-darwin-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_X64=$(shasum -a 256 artifacts/slack2-darwin-x64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/slack2-linux-arm64/*.tar.gz | cut -d' ' -f1)
          SHA_LINUX_X64=$(shasum -a 256 artifacts/slack2-linux-x64/*.tar.gz | cut -d' ' -f1)

          git clone https://x-access-token:${GH_TOKEN}@github.com/circlesac/homebrew-tap.git
          cd homebrew-tap
          cp ../homebrew/slack2.rb.template Formula/slack2.rb
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/slack2.rb
          sed -i "s/SHA_DARWIN_ARM64/${SHA_DARWIN_ARM64}/g" Formula/slack2.rb
          sed -i "s/SHA_DARWIN_X64/${SHA_DARWIN_X64}/g" Formula/slack2.rb
          sed -i "s/SHA_LINUX_ARM64/${SHA_LINUX_ARM64}/g" Formula/slack2.rb
          sed -i "s/SHA_LINUX_X64/${SHA_LINUX_X64}/g" Formula/slack2.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/slack2.rb
          git commit -m "Update slack2 to ${VERSION}"
          git push
